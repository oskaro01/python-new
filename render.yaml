services:
  - type: web
    name: personal-dictionary
    runtime: python
    plan: free
    rootDir: my_python_work/web_practice/02_django_basics/02_first_django_project
    buildCommand: ./build.sh
    startCommand: gunicorn mini_site.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CONN_MAX_AGE
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_EMAIL_BACKEND
        value: accounts.email_backend.ResendEmailBackend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: onboarding@resend.dev
