<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence Desk</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/marked.js"></script>
  <script defer src="vendor/purify.js"></script>
  <script defer src="vendor/exceljs.js"></script>
  <script defer src="vendor/fflate.js"></script>
  <script defer src="model.js"></script>
  <script defer src="storage.js"></script>
  <script defer src="exports.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="toggle-nav" class="icon-button" title="Toggle sections" aria-label="Toggle sections"><img src="assets/icons/panel-left.svg" alt=""></button>
    <a class="brand" href="#">Evidence Desk</a>
    <span id="save-status" role="status">Ready</span>
    <div class="top-actions">
      <button id="import-md"><img src="assets/icons/upload.svg" alt="">Import Markdown</button>
      <button id="export-xlsx" class="primary" disabled><img src="assets/icons/download.svg" alt="">Export Excel</button>
    </div>
  </header>
  <div class="workspace">
    <aside id="sidebar">
      <label class="small-label" for="project-select">WORKBOOK</label>
      <select id="project-select" aria-label="Workbook"><option value="">No workbooks</option></select>
      <div class="project-actions">
        <button id="update-md" disabled>Update template</button>
        <button id="backup" disabled>Backup</button>
        <button id="restore">Restore</button>
        <button id="delete-project" class="icon-button" disabled title="Delete workbook" aria-label="Delete workbook"><img src="assets/icons/trash-2.svg" alt=""></button>
      </div>
      <label class="search"><img src="assets/icons/search.svg" alt=""><input id="section-search" type="search" placeholder="Find a section" aria-label="Find a section"></label>
      <div class="outline-heading"><span>SECTIONS</span><span id="section-count">0</span></div>
      <nav id="sections" aria-label="Workbook sections"></nav>
      <footer class="sidebar-footer"><span id="evidence-count">0 screenshots</span><button id="print" disabled>Print</button></footer>
    </aside>
    <main id="main-content">
      <div id="empty-state" class="empty-state">
        <img src="assets/icons/notebook-pen.svg" alt="" width="40" height="40">
        <h1>New evidence workbook</h1>
        <button id="empty-import" class="primary"><img src="assets/icons/upload.svg" alt="">Import Markdown</button>
        <button id="load-example">Open sample workbook</button>
      </div>
      <div id="workbook" hidden>
        <div class="workbook-heading"><div><div id="document-label" class="eyebrow"></div><h1 id="product-title"></h1></div><span id="progress-label" class="progress-label"></span></div>
        <div id="review-banner" class="review-banner" hidden></div>
        <header class="section-heading"><div><p id="section-path" class="eyebrow"></p><h2 id="section-title"></h2></div><div class="section-actions"><button id="add-section-answer" type="button"><img src="assets/icons/plus.svg" alt="">Add answer</button><select id="section-status" aria-label="Section status"></select></div></header>
        <div id="section-content"></div>
        <section id="section-evidence" class="section-evidence"></section>
      </div>
    </main>
  </div>
  <input id="md-file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden>
  <input id="backup-file" type="file" accept=".zip,application/zip" hidden>
  <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
  <dialog id="image-preview"><button id="close-preview" class="preview-close" aria-label="Close preview">Close</button><img alt="Evidence screenshot"><p></p></dialog>
  <dialog id="answer-dialog" aria-labelledby="answer-dialog-title">
    <form id="answer-form">
      <h2 id="answer-dialog-title">Add answer</h2>
      <label class="field" for="answer-label"><span>Question or label</span><input id="answer-label" name="label" type="text" required maxlength="160" autocomplete="off" dir="auto"></label>
      <div class="dialog-actions"><button id="cancel-answer" type="button">Cancel</button><button class="primary" type="submit">Save</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
