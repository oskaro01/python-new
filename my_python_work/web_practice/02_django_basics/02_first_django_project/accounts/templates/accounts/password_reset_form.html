{% extends "pages/base.html" %}

{% block content %}
<h1>Reset password</h1>
<p class="muted">Enter your account email. Django will print a reset link in the terminal.</p>

<form method="post" class="form-panel auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
</form>

<p><a href="{% url 'accounts:login' %}">Back to log in</a></p>
{% endblock %}
