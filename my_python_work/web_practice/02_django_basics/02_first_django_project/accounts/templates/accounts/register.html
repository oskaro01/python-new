{% extends "pages/base.html" %}

{% block content %}
<h1>Create account</h1>
<p class="muted">Register with a username and password.</p>

<form method="post" class="form-panel auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>

<p>Already registered? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
{% endblock %}
