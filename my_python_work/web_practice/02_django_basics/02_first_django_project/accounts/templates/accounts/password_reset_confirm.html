{% extends "pages/base.html" %}

{% block content %}
<section class="form-page auth-page">
{% if validlink %}
<h1>Choose a new password</h1>

<form method="post" class="form-panel auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Set new password</button>
</form>
{% else %}
<h1>Reset link expired</h1>
<p class="muted">This link is no longer valid. Request a new one.</p>
<p><a href="{% url 'accounts:password_reset' %}">Request another reset link</a></p>
{% endif %}
</section>
{% endblock %}
