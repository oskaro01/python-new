{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'pages/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'pages:word_list' %}">Dictionary</a>
            <nav aria-label="Main navigation">
                <a href="{% url 'pages:word_list' %}">Words</a>
                <a href="{% url 'pages:new_word' %}">Add word</a>
                <a href="{% url 'pages:about' %}">About</a>
            </nav>
        </div>
        <div class="title-strip"><div class="title-strip-inner">Personal Dictionary</div></div>
    </header>

    <main class="page-shell">
    {% if messages %}
    <div aria-live="polite">
        {% for notice in messages %}
        <p class="notice">{{ notice }}</p>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
    </main>
</body>
</html>
