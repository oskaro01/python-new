{% extends "pages/base.html" %}

{% block content %}
<h1>Delete {{ word.word }}?</h1>
<p>This will remove the word from your dictionary.</p>

<form method="post" class="action-group">
    {% csrf_token %}
    <button type="submit" class="button-danger-solid">Delete word</button>
    <a class="button" href="{% url 'pages:word_detail' word.pk %}">Cancel</a>
</form>
{% endblock %}
