{% extends "pages/base.html" %}

{% block content %}
<p><a class="back-link" href="{% url 'pages:word_list' %}">Back to words</a></p>
<div class="page-heading">
    <div>
        <h1>{{ word.word }}</h1>
        {% if word.category %}<p class="muted">{{ word.category }}</p>{% endif %}
    </div>
    <div class="action-group">
        <a class="button" href="{% url 'pages:edit_word' word.pk %}">Edit</a>
        <a class="button button-danger" href="{% url 'pages:delete_word' word.pk %}">Delete</a>
    </div>
</div>

{% if word.meaning %}
<h2>Meaning</h2>
<p>{{ word.meaning }}</p>
{% endif %}

{% if word.example %}
<h2>Example</h2>
<p>{{ word.example }}</p>
{% endif %}

{% endblock %}
