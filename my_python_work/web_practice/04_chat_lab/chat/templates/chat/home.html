<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat home | Chat Lab</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'chat/styles.css' %}">
</head>
<body>
    <main class="shell">
        <section class="panel">
            <p class="eyebrow">Signed in</p>
            <h1>Welcome, {{ user.get_username }}.</h1>
            <p class="intro">Your inbox will live here once we add conversations.</p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="button button-muted" type="submit">Sign out</button>
            </form>
        </section>
    </main>
</body>
</html>
