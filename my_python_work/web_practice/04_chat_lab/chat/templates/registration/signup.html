<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Chat Lab</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'chat/styles.css' %}">
</head>
<body>
    <main class="shell">
        <section class="panel">
            <p class="eyebrow">Chat Lab</p>
            <h1>Create account</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="button" type="submit">Sign up</button>
            </form>
            <p class="intro">Already registered? <a href="{% url 'login' %}">Sign in</a>.</p>
        </section>
    </main>
</body>
</html>
